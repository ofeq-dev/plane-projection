<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Plane Projection logo">
  <!-- tile -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#0f172a"/>
  <!-- cube: top, left, right faces -->
  <polygon points="32,9 55,20 32,31 9,20" fill="#6478ff"/>
  <polygon points="9,20 32,31 32,55 9,44" fill="#27347c"/>
  <polygon points="55,20 32,31 32,55 55,44" fill="#3f52d8"/>
  <!-- slicing plane -->
  <polygon points="7,40 55,16 58,24 10,48" fill="#22d3ee" fill-opacity="0.42" stroke="#22d3ee" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- projection highlight on plane -->
  <circle cx="32" cy="32" r="3.2" fill="#ffffff"/>
</svg>
