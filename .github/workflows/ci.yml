name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest
      - name: Smoke run (brief's demo contract)
        run: python Ex0.py assets/nrrd/onion.nrrd assets/csv/onion.csv /tmp/smoke.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.python-version }}
          path: /tmp/smoke.mp4
          retention-days: 7
